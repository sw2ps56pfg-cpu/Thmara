<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>منصة ثمرة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap">
<script>try{var ac=localStorage.getItem("thamara-accent");if(ac)document.documentElement.setAttribute("data-accent",ac)}catch(e){}</script>
<script>try{var t=localStorage.getItem("thamara-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#F2F5FC;--surface:#FFFFFF;--surface2:#E6ECF8;--ink:#0F1A33;--muted:#58627D;--line:#D9E1F2;
  --brand:#1F4FD8;--brand-ink:#FFFFFF;--brand-soft:#DCE6FF;--accent:#F2A100;--accent-soft:#FFEDC2;--accent-ink:#7A4A00;
  --good:#17935A;--warn:#B56A00;--bad:#C4262E;--info:#0E8FA8;
  --t1:#DCE6FF;--t2:#FFEDC2;--t3:#D8F3E4;--t4:#DDE6FF;
  --nav:#FFFFFF;--nav-ink:#0F1A33;--nav-mut:#58627D;
  --ln-page:#F2F5FC;--ln-card:#FFFFFF;--ln-field:#F2F5FC;
  --f-body:'Tajawal','Segoe UI',Tahoma,system-ui,sans-serif;--f-display:'Tajawal','Segoe UI',Tahoma,system-ui,sans-serif;--logo-f:none;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1220;--surface:#131C30;--surface2:#1D2942;--ink:#EEF3FF;--muted:#9AA8C8;--line:#2A3856;
  --brand:#6D93FF;--brand-ink:#08122B;--brand-soft:#1B2E63;--accent:#FFB52E;--accent-soft:#40300F;--accent-ink:#FFD27A;
  --good:#52D49A;--warn:#F0A63B;--bad:#FF8A90;--info:#5FD0E6;
  --t1:#1A2B5E;--t2:#38290C;--t3:#10301F;--t4:#1B2547;
  --nav:#131C30;--nav-ink:#EEF3FF;--nav-mut:#9AA8C8;--ln-page:#0B1220;--ln-card:#131C30;--ln-field:#1D2942;--logo-f:brightness(2.1) saturate(1.1);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220;--surface:#131C30;--surface2:#1D2942;--ink:#EEF3FF;--muted:#9AA8C8;--line:#2A3856;
  --brand:#6D93FF;--brand-ink:#08122B;--brand-soft:#1B2E63;--accent:#FFB52E;--accent-soft:#40300F;--accent-ink:#FFD27A;
  --good:#52D49A;--warn:#F0A63B;--bad:#FF8A90;--info:#5FD0E6;
  --t1:#1A2B5E;--t2:#38290C;--t3:#10301F;--t4:#1B2547;
  --nav:#131C30;--nav-ink:#EEF3FF;--nav-mut:#9AA8C8;--ln-page:#0B1220;--ln-card:#131C30;--ln-field:#1D2942;--logo-f:brightness(2.1) saturate(1.1);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.8;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.4;text-wrap:balance;font-family:var(--f-display)}
p{margin:0}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.sm{font-size:13px}

/* الهيكل: شريط علوي عائم بشكل حبوب */
.shell{display:block}.mbar{display:none}.scrim{display:none}
.side{position:sticky;top:calc(10px + env(safe-area-inset-top,0px));z-index:20;margin:10px max(12px,3vw) 0;display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;
  background:color-mix(in srgb,var(--nav) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:7px 8px 7px 12px;box-shadow:0 10px 30px -18px rgba(40,20,80,.45)}
.side::-webkit-scrollbar{display:none}
.lgbox{background:#F6F3EA;border-radius:999px;padding:4px 14px;display:flex;flex:none;margin-inline-end:8px}.lgbox img{height:30px;width:auto;display:block}
.nav{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;white-space:nowrap;color:var(--nav-mut);font-weight:700;text-decoration:none;flex:none;border:0;background:none;cursor:pointer;font-size:13.5px;transition:background .15s,color .15s}
.nav:hover{background:var(--surface2);color:var(--nav-ink)}
.nav.on{background:var(--brand);color:var(--brand-ink)}
.nav .badge{background:var(--accent);color:#2B1B00;border-radius:9px;font-size:11px;padding:0 7px;font-weight:800}
.sp{flex:1;min-width:8px}
.who{display:none;flex-direction:column;line-height:1.3;padding:0 10px;flex:none;border-inline-start:1px solid var(--line)}.who b{font-weight:700;font-size:13px;white-space:nowrap}.who span{color:var(--muted);font-size:11px}
.seg{display:flex;background:var(--surface2);border-radius:999px;padding:3px;flex:none}
.seg button{border:0;background:none;color:var(--muted);padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.main{padding:34px max(16px,3.4vw) 80px;max-width:1280px;margin:0 auto;width:100%}
.top{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.top h1{font-size:clamp(32px,5vw,46px);font-weight:800;flex:1;min-width:150px;line-height:1.2;letter-spacing:0}
.hd{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:8px 18px 8px 10px;flex:none}
.hd .me{display:flex;align-items:center;gap:10px;min-width:0}.hd .me b{display:block;font-weight:800;line-height:1.3;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}.hd .me div span{display:block;font-size:12px;color:var(--muted);line-height:1.3;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.hd .clk{padding-inline-start:14px;border-inline-start:2px dashed var(--line);display:flex;flex-direction:column;align-items:flex-end;line-height:1.3}
.hd .clk b{font-family:var(--f-display);font-size:21px;font-weight:700;color:var(--brand);letter-spacing:.02em}.hd .clk span{font-size:12px;color:var(--muted);white-space:nowrap}
.idc{position:relative;overflow:hidden;color:#fff;border-radius:26px;padding:18px 20px;aspect-ratio:1.586/1;min-height:200px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,#1F2E5C,#0F1A33)}
.idc.leader{background:linear-gradient(135deg,#1F4FD8,#12307F)}.idc.manager{background:linear-gradient(135deg,#E08A00,#B4410F)}
.idc::before{content:'';position:absolute;inset-inline-end:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.idc::after{content:'';position:absolute;inset-inline-start:-40px;bottom:-70px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.idc>*{position:relative;z-index:1}
.idc-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.idc .lg{background:#F6F3EA;border-radius:999px;padding:3px 14px;display:flex}.idc .lg img{height:26px;display:block}
.idc-no{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.06em;background:rgba(255,255,255,.18);border-radius:999px;padding:2px 12px}
.idc-body{display:flex;align-items:center;gap:14px;min-width:0}.idc-body .ava{width:62px;height:62px;font-size:26px;background:rgba(255,255,255,.95);color:#0F1A33;font-family:var(--f-display)}
.idc-name{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,3.2vw,25px);line-height:1.3;overflow-wrap:anywhere}.idc-pos{opacity:.9;font-size:14px}
.idc-foot{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;font-size:12px}.idc-foot span{display:block;opacity:.75;font-size:11px}.idc-foot b{font-weight:700;font-size:13px}.idc-foot .st{margin-inline-start:auto;background:rgba(255,255,255,.2);border-radius:999px;padding:1px 12px;font-weight:700}
.idg{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}.idg .idc{cursor:pointer;transition:transform .15s}.idg .idc:hover{transform:translateY(-3px)}
#splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;color:#fff;background:radial-gradient(55% 45% at 50% 42%,#6A2250 0,#2A1745 55%,#0F1A33 100%);transition:opacity .55s ease,transform .7s cubic-bezier(.5,0,.2,1),visibility .55s}
#splash.out{opacity:0;visibility:hidden;transform:scale(1.12)}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px;text-align:center}
.sp-logo{position:relative;background:#F6F3EA;border-radius:999px;padding:18px 42px;animation:spop .9s cubic-bezier(.2,1.5,.4,1) both}
.sp-logo img{height:84px;width:auto;display:block}
.sp-logo::before,.sp-logo::after{content:'';position:absolute;inset:0;border-radius:999px;border:2px solid rgba(255,255,255,.45);animation:sring 2.2s ease-out infinite}.sp-logo::after{animation-delay:1.1s}
.sp-t{font-family:var(--f-display);font-size:24px;font-weight:700;animation:sup .7s .55s both}
.sp-n{font-size:16px;opacity:.85;min-height:1.7em;animation:sup .7s .85s both}
.sp-bar{width:150px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden;animation:sup .5s .4s both}.sp-bar i{display:block;height:100%;background:#F2A100;border-radius:4px;transform-origin:100% 50%;animation:sfill 1.9s .3s cubic-bezier(.4,0,.2,1) both}
@keyframes spop{from{transform:scale(.3) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
@keyframes sring{from{transform:scale(1);opacity:.9}to{transform:scale(2.1,2.8);opacity:0}}
@keyframes sup{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes sfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.awg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.awc{display:flex;align-items:center;gap:10px;padding:14px;border-radius:20px;background:var(--surface2);cursor:pointer;min-width:0;position:relative}
.awc .g{flex:1;min-width:0}.awc .t{font-weight:700;overflow-wrap:anywhere}.awc:hover{outline:2px solid var(--brand)}
.awc.r1{background:linear-gradient(135deg,var(--accent-soft),var(--surface2))}
.awr{position:absolute;top:-8px;inset-inline-start:-6px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--ink);color:var(--bg)}
.awc.r1 .awr{background:var(--accent);color:#2B1B00}
@media (max-width:860px){.awg{grid-template-columns:minmax(0,1fr)}}
.tick{display:flex;align-items:center;gap:0;margin-bottom:16px;background:var(--ink);color:var(--bg);border-radius:999px;overflow:hidden;min-height:48px}
.tk-l{flex:none;background:var(--accent);color:#2B1B00;font-weight:800;font-size:13px;padding:0 18px;align-self:stretch;display:flex;align-items:center}
.tk-v{flex:1;overflow:hidden;min-width:0;direction:rtl}
.tk-in{display:flex;width:max-content;animation:tk 34s linear infinite}.tick:hover .tk-in{animation-play-state:paused}
.tk-g{display:flex;flex:none;min-width:100vw}.tk-i{display:inline-flex;align-items:center;gap:12px;padding:0 22px;white-space:nowrap;font-weight:500}
.tk-d{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;flex:none}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(50%)}}
.tk-e{flex:none;border:0;background:rgba(255,255,255,.12);color:inherit;width:36px;height:36px;border-radius:50%;margin:0 6px;cursor:pointer}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pc{background:var(--surface);border:2px solid var(--line);border-radius:26px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s}.pc:hover{border-color:var(--brand);transform:translateY(-2px)}
.pc.off{opacity:.65}.pc img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--surface2)}
.pb{padding:16px 18px 18px}.pt{white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted)}
.top .sub{display:block;font-family:var(--f-body);font-size:15px;font-weight:400;color:var(--muted);margin-top:6px}

.btn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 18px;min-height:42px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:transform .12s,background .15s}
.btn:hover{background:var(--surface2)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{min-height:34px;padding:2px 14px;font-size:13px}.btn[disabled]{opacity:.55;cursor:wait}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}.btn.bad:disabled{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:0 11px;font-size:12px;font-weight:700;line-height:24px;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.c-info{background:color-mix(in srgb,var(--info) 16%,var(--surface));color:var(--info)}.c-brand{background:var(--brand-soft);color:var(--brand)}
.c-warn{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn)}.c-bad{background:color-mix(in srgb,var(--bad) 15%,var(--surface));color:var(--bad)}
.c-good{background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--good)}.c-acc{background:var(--accent-soft);color:var(--accent-ink)}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:22px;min-width:0}
.panel.click{transition:transform .15s,border-color .15s}.panel.click:hover{border-color:var(--brand);transform:translateY(-2px)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}.ph h3{font-size:19px}
.ph a{font-size:13px;color:var(--brand);font-weight:700;text-decoration:none}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.gm{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
/* بلاطات الأرقام: كل بلاطة بلون */
.band{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}
.band>div{padding:20px 22px;border-radius:26px;background:var(--t1);color:var(--ink)}
.band>div:nth-child(2){background:var(--t2)}.band>div:nth-child(3){background:var(--t3)}.band>div:nth-child(4){background:var(--t4)}
.band .k{color:color-mix(in srgb,var(--ink) 70%,transparent);font-size:14px;font-weight:700}
.band .v{font-family:var(--f-display);font-weight:800;font-size:clamp(38px,5vw,54px);line-height:1.1;margin:4px 0 10px;color:var(--ink)}
.band .s{display:flex;gap:6px;flex-wrap:wrap}.band .chip{background:color-mix(in srgb,var(--surface) 75%,transparent)}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}.bar.bad i{background:var(--bad)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:2px dashed var(--line);min-width:0}.li:first-child{border-top:0;padding-top:0}
.li.click{cursor:pointer}.li.click:hover .t{color:var(--brand)}.li .t{font-weight:700;overflow-wrap:anywhere}.li .g{flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--brand);flex:none}
.ava{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;flex:none}
.tw{overflow-x:auto;border:2px solid var(--line);border-radius:26px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}th,td{padding:12px 18px;text-align:start;border-top:2px solid var(--line);vertical-align:middle}
thead th{border-top:0;background:var(--surface2);font-size:13px;color:var(--muted);white-space:nowrap;font-weight:700}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--bg)}
.cols{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:18px}.cols>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}.cols i{display:block;width:100%;background:var(--brand);border-radius:99px 99px 6px 6px;min-height:4px}.cols div:nth-child(even) i{background:var(--accent)}.cols b{font-size:12px;margin-bottom:3px}.cols span{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap}
.dz{border-color:var(--bad)!important}.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:2px dashed var(--line)}.chk input{margin-top:5px;accent-color:var(--brand)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.sel,.fld input,.fld select,.fld textarea{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:8px 14px;min-height:46px;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--brand);outline:0}
.sel{width:auto;border-radius:999px}
.kan{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface2);border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col>h4{font-size:14px;display:flex;justify-content:space-between;align-items:center;padding:2px 6px}
.tc{background:var(--surface);border:2px solid transparent;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.tc:hover{border-color:var(--brand)}.tc.late{border-color:color-mix(in srgb,var(--bad) 60%,var(--line))}.tc .t{font-weight:700;overflow-wrap:anywhere}
.row{display:flex;align-items:center;gap:10px;min-width:0}.acts{display:flex;gap:8px;flex-wrap:wrap}
#ov{position:fixed;inset:0;background:rgba(20,8,40,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:min(620px,100%);max-height:92dvh;overflow:auto;border-radius:30px 30px 0 0;padding:22px max(20px,env(safe-area-inset-left,0px)) 44px;animation:up .24s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
.sh{display:flex;gap:10px;align-items:flex-start;margin-bottom:16px}.sh h2{flex:1;font-size:24px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}.fld label{font-size:13px;color:var(--muted);font-weight:700}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:0 0 14px}.kv dt{color:var(--muted);font-size:13px}.kv dd{margin:0;overflow-wrap:anywhere}
.sec{margin-top:22px}.sec>h4{font-size:14px;color:var(--muted);margin-bottom:8px}
.tl{border-inline-start:3px solid var(--line);padding-inline-start:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:80;pointer-events:none}
.toast span{background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 20px;font-weight:700;max-width:90vw}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* شاشات الدخول */
.ln{min-height:100dvh;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:32px 16px;position:relative;
  background:radial-gradient(50% 40% at 95% 5%,color-mix(in srgb,var(--brand) 22%,transparent),transparent),radial-gradient(45% 40% at 5% 95%,color-mix(in srgb,var(--accent) 28%,transparent),transparent),var(--ln-page)}
.ln .logo{background:#F6F3EA;border-radius:999px;padding:10px 30px;display:flex}.ln img.mark{height:76px;width:auto;max-width:80%}
.ln-card{width:100%;max-width:420px;background:var(--ln-card);border:2px solid var(--line);border-radius:32px;padding:30px 26px}
.ln-card h1{font-size:28px;margin-bottom:4px}.ln-card .sub{color:var(--muted);font-size:14px;margin-bottom:22px}
.ln .fld label{color:var(--muted)}.ln .fld input{background:var(--ln-field);color:var(--ink);min-height:50px}

function rptData(key){
  const days=RP[key][1],end=Date.now(),st=end-days*864e5,ps=st-days*864e5,inR=(d,a,b)=>{const t=+new Date(d);return t>a&&t<=b};

  const cur=mk(st,end),prev=mk(ps,st),nb=RP[key][2],step=days*864e5/nb,bk=[];

async function shrink(file){
  const url=URL.createObjectURL(file);try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const m=1600,k=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    return await new Promise(ok=>c.toBlob(ok,'image/jpeg',.82))}finally{URL.revokeObjectURL(url)}}

  if(a==='cmrem'){e.stopPropagation();const p=P.find(x=>x.id===id),cid=el.dataset.c;if(!p||!confirm('إزالة «'+(p.full_name||p.email)+'» من اللجنة؟ يبقى حسابه في المبادرة بدون لجنة.'))return;
    try{const patch={dept_id:null};if(p.role==='manager')patch.role='member';await q(sb.from('profiles').update(patch).eq('id',id));
      const hd=D.filter(d=>d.head_id===id);for(const d of hd)await q(sb.from('departments').update({head_id:null}).eq('id',d.id));
      await notify([id],'أُزيلت عضويتك من '+dn(p.dept_id),'home');await log('أزال '+(p.full_name||p.email)+' من '+dn(p.dept_id));await reload();committeeSheet(cid)}catch(err){fail(err)}return}
  if(a==='deptnew'){deptSheet('',el.dataset.p||'');return}

  if(a==='readers'){readersSheet(+id);return}
  if(a==='logout'){stopPresence();await sb.auth.signOut();me=null;booted=false;closeSheet();location.hash='';loginScreen();return}
  if(a==='reload'){location.reload();return}
  if(a==='forgot'){const em=$('#lgE').value.trim();if(!/^\S+@\S+\.\S+$/.test(em)){loginScreen('اكتب بريدك أولًا ثم اضغط «نسيت كلمة المرور».');return}
    const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});loginScreen(error?'تعذر الإرسال: '+error.message:'أرسلنا رابط الاستعادة إلى بريدك إن كان مسجلًا لدينا.',!error);return}
  if(a==='task'){if(e.target.closest('.acts'))return;taskSheet(+id);return}
  if(a.startsWith('t-')){e.stopPropagation();moveTask(+id,a.slice(2));return}
  if(a==='newtask'){newTaskSheet();return}

  if(a==='genpw'){const i=$('#'+el.dataset.t);if(i){i.value=genPw();i.type='text'}return}
  if(a==='delmember'){const p=P.find(x=>x.id===id);if(!p||!confirm('حذف حساب «'+(p.full_name||p.email)+'» نهائيًا؟ تبقى مهامه بلا مكلّف.'))return;
    try{await adm({action:'delete_user',id});closeSheet();toast('حُذف الحساب');await reload()}catch(err){fail(err)}return}
  if(a==='soc-add'){socAcctSheet();return}
  if(a==='soc-edit'){socAcctSheet(+id);return}
  if(a==='soc-stat'){e.stopPropagation();socStatSheet(+id);return}
  if(a==='soc-open'){socOpenSheet(+id);return}
  if(a==='soc-del'){if(!confirm('حذف الحساب وكل أرقامه؟'))return;try{await q(sb.from('social_accounts').delete().eq('id',+id));await log('حذف حساب تواصل');closeSheet();await reload()}catch(err){fail(err)}return}
  if(a==='soc-delstat'){try{await q(sb.from('social_stats').delete().eq('id',+id));await reload();socOpenSheet(+el.dataset.a)}catch(err){fail(err)}return}
  if(a==='wipeall'||a==='wipenone'){document.querySelectorAll('.wk').forEach(c=>c.checked=a==='wipeall');wipeChk();return}
  if(a==='mypass'){passSheet();return}
  if(a==='invcopy'){const i=INV.find(x=>x.code===el.dataset.code);if(i)inviteSheet(i);return}
  if(a==='invdel'){try{await q(sb.from('invites').delete().eq('code',el.dataset.code));await log('ألغى دعوة');await reload();toast('أُلغيت الدعوة')}catch(err){fail(err)}return}
  if(a==='tojoin'){joinScreen();return}
  if(a==='tologin'){loginScreen();return}
  if(a==='copycreds'){const ta=$('#credTxt');ta.select();let ok=false;try{await navigator.clipboard.writeText(ta.value);ok=true}catch(err){try{ok=document.execCommand('copy')}catch(e2){}}toast(ok?'نُسخت الرسالة':'حدّد النص وانسخه يدويًا');return}
  if(a==='readc'){try{await q(sb.from('circular_reads').insert({circular_id:+id}));await reload()}catch(err){fail(err)}return}
  if(a==='nread'){try{await q(sb.from('notifications').update({read:true}).eq('id',+id))}catch(err){}
    const l=el.dataset.link;await reload();if(l&&NAV.find(n=>n[0]===l)){location.hash='#'+l}return}
  if(a==='readall'){try{await q(sb.from('notifications').update({read:true}).eq('user_id',me.id).eq('read',false));await reload()}catch(err){fail(err)}return}
});
function wipeChk(){const b=$('#wGo');if(!b)return;b.disabled=!(document.querySelector('.wk:checked')&&$('#wc').value.trim()==='حذف')}
document.addEventListener('input',e=>{if(e.target.id==='wc')wipeChk()});
document.addEventListener('change',e=>{
  if(e.target.id==='pt3'){pendImg=e.target.files[0]||null;pendRemove=false}
  if(e.target.classList&&e.target.classList.contains('wk'))wipeChk();
  const el=e.target;
  if(el.classList&&el.classList.contains('rolesel')){const id=el.dataset.id,p=P.find(x=>x.id===id),nr=el.value;if(!p||nr===p.role)return;
    (async()=>{try{
      if(nr==='manager'&&!p.dept_id){alert('أضف الشخص إلى لجنة أولًا ثم اجعله مدير إدارة.');render();return}
      if(!confirm('تغيير دور «'+(p.full_name||p.email)+'» إلى '+RL[nr]+'؟')){render();return}
      await q(sb.from('profiles').update({role:nr}).eq('id',id));
      if(nr==='member'){for(const d of D.filter(d=>d.head_id===id))await q(sb.from('departments').update({head_id:null}).eq('id',d.id))}
      await notify([id],'تغيّر دورك إلى '+RL[nr],'home');await log('غيّر دور '+(p.full_name||p.email)+' إلى '+RL[nr]);await reload();toast('تم تغيير الدور')}catch(err){fail(err);render()}})();return}
  if(el.id==='fDept'){filt.dept=el.value;render()}
  if(el.id==='fMine'){filt.mine=el.checked;render()}
  if(el.id==='ndp')fillAssignees();
});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,k=f.dataset.form,btn=f.querySelector('button:not([type=button])');
  const busy=v=>{if(btn)btn.disabled=v};
  try{
    if(k==='login'){let em=$('#lgE').value.trim().replace(/^@/,''),pw=$('#lgP').value;
      if(!em){loginScreen('اكتب بريدك أو اسم المستخدم.');return}
      if(!pw){loginScreen('اكتب كلمة المرور.');return}
      busy(true);
      if(!em.includes('@')){const rr=await sb.rpc('email_by_username',{u:em});if(rr.error||!rr.data){loginScreen('اسم المستخدم غير موجود.');return}em=rr.data}
const {data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
      if(error){loginScreen(error.message==='Invalid login credentials'?'البريد أو كلمة المرور غير صحيحة.':'تعذر الدخول: '+error.message);return}
      await enter(data.session);return}
    if(k==='newpass'){const a=$('#np1').value,b=$('#np2').value;
      if(a.length<8){passScreen('كلمة المرور لا تقل عن 8 خانات.');return}
      if(a!==b){passScreen('كلمتا المرور غير متطابقتين.');return}
      busy(true);const {error}=await sb.auth.updateUser({password:a});
      if(error){passScreen('تعذر الحفظ: '+error.message);return}
      history.replaceState(null,'',location.pathname);const {data:{session}}=await sb.auth.getSession();await enter(session);return}
    if(k==='join'){const code=$('#jc').value.trim(),em=$('#je').value.trim(),a=$('#jp1').value,b=$('#jp2').value;
      if(code.replace(/[^A-Za-z0-9]/g,'').length!==10){joinScreen('رمز التفعيل 10 خانات، تأكد منه.',code,em);return}
      if(!/^\S+@\S+\.\S+$/.test(em)){joinScreen('اكتب بريدًا إلكترونيًا صحيحًا.',code,em);return}
      if(a.length<8){joinScreen('كلمة المرور لا تقل عن 8 خانات.',code,em);return}
      if(a!==b){joinScreen('كلمتا المرور غير متطابقتين.',code,em);return}
      busy(true);const {data,error}=await sb.functions.invoke('redeem-invite',{body:{code,email:em,password:a}});
      if(error){let m=error.message;try{const j=await error.context.json();m=j.error||m}catch(e2){}joinScreen(m,code,em);return}
      if(data&&data.error){joinScreen(data.error,code,em);return}
      history.replaceState(null,'',location.pathname);
      const r2=await sb.auth.signInWithPassword({email:em,password:a});
      if(r2.error){loginScreen('تم تفعيل حسابك. سجّل دخولك الآن.',true);return}
      await enter(r2.data.session);return}
    busy(true);
    if(k==='comment'){const v=$('#cm').value.trim();if(!v){busy(false);return}
      await q(sb.from('task_events').insert({task_id:+f.dataset.id,kind:'comment',body:v}));taskSheet(+f.dataset.id);return}
    if(k==='newtask'){const title=$('#nt').value.trim(),w=$('#nw').value;
      if(!w){toast('اختر مكلّفًا من الإدارة');busy(false);return}
      const row=await q(sb.from('tasks').insert({title,description:$('#nd').value.trim(),dept_id:$('#ndp').value,assignee_id:w,due:$('#ndu').value,priority:$('#npr').value,needs_formal_approval:$('#nf').checked}).select().single());
      await q(sb.from('task_events').insert({task_id:row.id,kind:'created',body:'أُنشئت المهمة وكُلّف بها '+pn(w)}));
      await notify([w],'كُلّفت بمهمة جديدة: '+title,'tasks');await log('أنشأ مهمة: '+title);
      closeSheet();toast('أُنشئت المهمة وأُرسل إشعار للمكلّف');await reload();return}
    if(k==='member'){const id=f.dataset.id,p=P.find(x=>x.id===id),self=id===me.id;
      const pw=$('#mpw').value.trim();if(pw&&pw.length<8){toast('كلمة المرور لا تقل عن 8 خانات');busy(false);return}
      const em=$('#mem').value.trim();const body={action:'update',id,full_name:$('#mnm').value.trim(),username:$('#mus').value.trim(),dept_id:$('#mdp').value,position:$('#mpo').value.trim(),manager_id:$('#mmg').value};
      if(em&&em!==p.email)body.email=em;if(pw)body.password=pw;
      if(!self){body.role=$('#mrl').value;body.status=$('#mst').value}
      await adm(body);
      if(!self&&p.dept_id!==(body.dept_id||null))await notify([id],'نُقلت إلى '+dn(body.dept_id||null),'home');
      if(!self&&p.status==='new'&&body.status==='new'&&body.dept_id)await q(sb.from('profiles').update({status:'active'}).eq('id',id));
      closeSheet();toast(pw?'حُفظت التغييرات وكلمة المرور الجديدة':'حُفظت التغييرات');await reload();return}
    if(k==='tickadd'){const v=$('#tk1').value.trim();if(!v){busy(false);return}
      await q(sb.from('home_items').insert({kind:'ticker',title:v}));await log('أضاف إعلانًا للشريط');await reload();tickSheet();return}
    if(k==='post'){const id=f.dataset.id,old=HM.find(h=>h.id===+id)||{};let image_url=old.image_url||null,image_path=old.image_path||null;
      if(pendRemove){await dropImg(image_path);image_url=null;image_path=null}
      if(pendImg){const blob=await shrink(pendImg),path='posts/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
        const up=await sb.storage.from('home').upload(path,blob,{contentType:'image/jpeg'});if(up.error)throw new Error('تعذر رفع الصورة: '+up.error.message+' (تأكد من تشغيل ملف setup4.sql)');
        await dropImg(image_path);image_path=path;image_url=sb.storage.from('home').getPublicUrl(path).data.publicUrl}
      const row={kind:'post',title:$('#pt1').value.trim(),body:$('#pt2').value.trim(),image_url,image_path,active:$('#pt4').checked};
      if(id)await q(sb.from('home_items').update(row).eq('id',+id));else await q(sb.from('home_items').insert(row));
      await log((id?'عدّل':'نشر')+' منشورًا في الرئيسية: '+row.title);closeSheet();toast('حُفظ المنشور');await reload();return}
    if(k==='perm'){const id=f.dataset.id,p=P.find(x=>x.id===id),np={};f.querySelectorAll('select[data-k]').forEach(el=>{if(el.value!=='')np[el.dataset.k]=+el.value});
      await q(sb.from('profiles').update({perms:np}).eq('id',id));await notify([id],'تم تحديث صلاحياتك','home');await log('حدّد صلاحيات '+(p.full_name||p.email));
      toast('حُفظت الصلاحيات');closeSheet();await reload();return}
    if(k==='cmadd'){const cid=f.dataset.id,pid=$('#ca1').value,dest=$('#ca2').value,pos=$('#ca3').value.trim(),p=P.find(x=>x.id===pid);if(!pid){busy(false);return}
      const patch={dept_id:dest};if(pos)patch.position=pos;if(p&&p.status==='new')patch.status='active';
      await q(sb.from('profiles').update(patch).eq('id',pid));await notify([pid],'أُضفت إلى '+dn(dest),'home');await log('أضاف '+(p.full_name||p.email)+' إلى '+dn(dest));
      toast('أُضيف العضو');await reload();committeeSheet(cid);return}
    if(k==='deptmove'){const to=$('#dm1').value;if(!to){busy(false);return}await deptRemove(f.dataset.id,to);return}
    if(k==='dept'){const id=f.dataset.id,name=$('#dn1').value.trim();if(!name){busy(false);return}
      const par=$('#dn3').disabled?(D.find(x=>x.id===id)||{}).parent_id||null:($('#dn3').value||null),head=$('#dn4').value||null,old=D.find(x=>x.id===id)||{};
      const row={name,goal:$('#dn2').value.trim()||null,parent_id:par,head_id:head};let did=id;
      if(id)await q(sb.from('departments').update(row).eq('id',id));else{did='d'+Date.now().toString(36);await q(sb.from('departments').insert(Object.assign({id:did},row)))}
      if(!par&&head&&head!==old.head_id){const hp=P.find(p=>p.id===head);
        if(hp&&hp.role!=='leader')await q(sb.from('profiles').update({role:'manager',dept_id:did,status:hp.status==='new'?'active':hp.status}).eq('id',head));
        await notify([head],'عُيّنت رئيسًا للجنة «'+name+'»','committees')}
      if(!par&&old.head_id&&old.head_id!==head){const op=P.find(p=>p.id===old.head_id);
        if(op&&op.role==='manager'&&!D.some(d=>d.id!==did&&d.head_id===op.id&&!d.parent_id))await q(sb.from('profiles').update({role:'member'}).eq('id',old.head_id))}
      await log((id?'عدّل ':'أضاف ')+(par?'قسم ':'لجنة ')+name);closeSheet();toast(id?'حُفظت التغييرات':'تمت الإضافة');await reload();return}
    if(k==='addacct'){const name=$('#aa1').value.trim(),em=$('#aa3').value.trim().toLowerCase(),pw=$('#aa4').value.trim(),un=$('#aa2').value.trim();
      if(!name||!em){busy(false);return}if(pw.length<8){toast('كلمة المرور لا تقل عن 8 خانات');busy(false);return}
      await adm({action:'create',full_name:name,username:un,email:em,password:pw,dept_id:$('#aa5').value,position:$('#aa6').value.trim(),role:$('#aa7').value,manager_id:$('#aa8').value});
      await reload();
      credSheet(`أهلًا ${name}، تمت إضافتك إلى منصة ثمرة.\nالرابط: ${location.origin+location.pathname}\nالبريد: ${em}${un?`\nاسم المستخدم: ${un.replace(/^@/,'')}`:''}\nكلمة المرور: ${pw}\nيمكنك تغيير كلمة المرور بعد الدخول من زر «كلمة المرور» أعلى الصفحة.`);return}
    if(k==='socacct'){const row={platform:$('#sp').value,handle:$('#sh').value.trim().replace(/^@/,''),url:$('#su').value.trim()||null};
      if(f.dataset.id)await q(sb.from('social_accounts').update(row).eq('id',+f.dataset.id));else await q(sb.from('social_accounts').insert(row));
      await log('حدّث حسابات التواصل');closeSheet();await reload();return}
    if(k==='socstat'){const n=v=>v===''?null:+v,aid=+f.dataset.id;
      const row={account_id:aid,day:$('#sd').value,followers:n($('#sf1').value),following:n($('#sf2').value),posts:n($('#sf3').value),views:n($('#sf4').value),likes:n($('#sf5').value),note:$('#sf6').value.trim()||null};
      await q(sb.from('social_stats').upsert(row,{onConflict:'account_id,day'}));await log('حدّث أرقام حساب تواصل');closeSheet();toast('حُفظت الأرقام');await reload();return}
    if(k==='wipe'){const sc=[...document.querySelectorAll('.wk:checked')].map(c=>c.value);
      if(!sc.length||$('#wc').value.trim()!=='حذف'){busy(false);return}
      const r2=await adm({action:'wipe',scopes:sc,confirm:'حذف'});toast('تم المسح: '+((r2&&r2.done||[]).join('، ')||'لا شيء'));await reload();return}
    if(k==='addmember'){const name=$('#am1').value.trim();if(!name){busy(false);return}
      const row={code:genCode(),full_name:name,dept_id:$('#am3').value,position:$('#am4').value.trim()||'عضو',role:$('#am5').value,manager_id:$('#am6').value||null,expires_at:new Date(Date.now()+(+$('#am8').value)*864e5).toISOString()};
      await q(sb.from('invites').insert(row));await log('أنشأ دعوة لـ '+name);await reload();inviteSheet(row);return}
    if(k==='mypass'){const a=$('#mp1').value,b=$('#mp2').value;
      if(a.length<8){toast('كلمة المرور لا تقل عن 8 خانات');busy(false);return}
      if(a!==b){toast('كلمتا المرور غير متطابقتين');busy(false);return}
      const {error}=await sb.auth.updateUser({password:a});if(error)throw error;closeSheet();toast('تم تغيير كلمة المرور');return}
    if(k==='newcirc'){const title=$('#ct').value.trim(),dept=$('#cd').value||null;
      await q(sb.from('circulars').insert({title,body:$('#cb').value.trim(),target_dept:dept,important:$('#ci').checked}));
      await notify(P.filter(p=>p.status!=='left'&&(!dept||p.dept_id===dept)).map(p=>p.id),'تعميم جديد: '+title,'circulars');
      await log('نشر تعميمًا: '+title);closeSheet();toast('نُشر التعميم');await reload();return}
  }catch(err){fail(err);busy(false)}
});
document.addEventListener('click',e=>{if(e.target.closest('.side a.nav'))document.body.classList.remove('menu-open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();document.body.classList.remove('menu-open')}});
sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_OUT'&&me){me=null;booted=false;loginScreen()}});
boot().then(()=>splashHide(2100),()=>splashHide(500));
