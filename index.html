<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>منصة ثمرة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Noto+Kufi+Arabic:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#F6F4EE;--surface:#fff;--surface2:#ECE9DE;--ink:#26301D;--muted:#6B705D;--line:#DDD9CB;
  --brand:#46552E;--brand-ink:#fff;--brand-soft:#E3E9D5;--accent:#8A6A1E;--accent-soft:#F1E6C8;
  --good:#2C8556;--warn:#B8730A;--bad:#BC3A2C;--info:#2D68A8;
  --f-body:'Tajawal','Segoe UI',Tahoma,system-ui,sans-serif;--f-display:'Noto Kufi Arabic','Tajawal',Tahoma,sans-serif;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root{
  --bg:#12170E;--surface:#1B2216;--surface2:#242C1D;--ink:#ECF0E3;--muted:#A0A98F;--line:#313B27;
  --brand:#A3BC72;--brand-ink:#12170E;--brand-soft:#29341C;--accent:#D9B45A;--accent-soft:#3A3116;
  --good:#5FCB93;--warn:#E3A33F;--bad:#EE7B6C;--info:#6FA8E6;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.locked{padding-left:0;padding-right:0}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.4;text-wrap:balance}
p{margin:0}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.sm{font-size:13px}
.wrap{max-width:1280px;margin:0 auto}
.bar-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:6px;overflow-x:auto;padding:10px 0;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:thin}
.lgbox{background:#F8F5F0;border-radius:12px;padding:5px 10px;display:inline-flex;flex:none;margin-inline-end:8px}.lgbox img{height:34px;width:auto;display:block}
.nav{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:20px;white-space:nowrap;color:var(--ink);font-weight:500;text-decoration:none;flex:none;border:0;background:none;cursor:pointer}
.nav:hover{background:var(--surface2)}.nav.on{background:var(--brand);color:var(--brand-ink)}
.nav .badge{background:var(--accent);color:var(--brand-ink);border-radius:9px;font-size:11px;padding:0 7px;font-weight:700}
.sp{flex:1}
.main{padding:26px 0 64px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-family:var(--f-display);font-size:26px;flex:1;min-width:150px}
.top .sub{display:block;font-family:var(--f-body);font-size:13px;font-weight:400;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 14px;min-height:38px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface2)}.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}.btn.pri:hover{filter:brightness(1.1)}
.btn.sm{min-height:32px;padding:2px 11px;font-size:13px}.btn[disabled]{opacity:.55;cursor:wait}
.chip{display:inline-flex;align-items:center;border-radius:20px;padding:0 10px;font-size:12px;font-weight:500;line-height:22px;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.c-info{background:color-mix(in srgb,var(--info) 15%,var(--surface));color:var(--info)}.c-brand{background:var(--brand-soft);color:var(--brand)}
.c-warn{background:color-mix(in srgb,var(--warn) 17%,var(--surface));color:var(--warn)}.c-bad{background:color-mix(in srgb,var(--bad) 15%,var(--surface));color:var(--bad)}
.c-good{background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--good)}.c-acc{background:var(--accent-soft);color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.ph h3{font-size:16px}
.ph a{font-size:13px;color:var(--brand);font-weight:500;text-decoration:none}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.gm{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.band{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.band>div{padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.band .k{color:var(--muted);font-size:13px;font-weight:500}.band .v{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.2;margin:2px 0 6px}
.band .s{display:flex;gap:6px;flex-wrap:wrap}
.bar{height:7px;border-radius:5px;background:var(--surface2);overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}.bar.bad i{background:var(--bad)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}.li:first-child{border-top:0;padding-top:0}
.li.click{cursor:pointer}.li.click:hover .t{color:var(--brand)}.li .t{font-weight:500;overflow-wrap:anywhere}.li .g{flex:1;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.ava{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}th,td{padding:10px 14px;text-align:start;border-top:1px solid var(--line);vertical-align:middle}
thead th{border-top:0;background:var(--surface2);font-size:13px;color:var(--muted);white-space:nowrap}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--bg)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.sel,.fld input,.fld select,.fld textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-height:40px;width:100%}
.sel{width:auto}
.kan{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface2);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col>h4{font-size:13px;display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.tc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.tc:hover{border-color:var(--brand)}.tc.late{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}.tc .t{font-weight:500;overflow-wrap:anywhere}
.row{display:flex;align-items:center;gap:10px;min-width:0}.acts{display:flex;gap:6px;flex-wrap:wrap}
#ov{position:fixed;inset:0;background:rgba(8,16,12,.5);z-index:50;display:flex}
.sheet{background:var(--bg);width:min(560px,100%);height:100%;overflow:auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 40px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.sh{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}.sh h2{flex:1;font-size:20px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}.fld label{font-size:13px;color:var(--muted);font-weight:500}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:0 0 14px}.kv dt{color:var(--muted);font-size:13px}.kv dd{margin:0;overflow-wrap:anywhere}
.sec{margin-top:18px}.sec>h4{font-size:13px;color:var(--muted);margin-bottom:8px}
.tl{border-inline-start:2px solid var(--line);padding-inline-start:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:80;pointer-events:none}
.toast span{background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 16px;font-weight:500;max-width:90vw}
.empty{padding:22px;text-align:center;color:var(--muted)}
/* auth screens: always the logo's cream and olive */
.ln{--o:#46552E;--o2:#7A9150;--ink2:#26301D;--mu:#6E7260;--bd:#DCD7C9;min-height:100dvh;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px 16px;
  background:radial-gradient(circle at 100% 0,rgba(122,145,80,.22),transparent 38%),radial-gradient(circle at 0 100%,rgba(70,85,46,.16),transparent 42%),#F8F5F0}
.ln img.mark{height:104px;width:auto;max-width:80%}
.ln-card{width:100%;max-width:400px;background:#fff;border:1px solid var(--bd);border-radius:22px;padding:26px 24px;box-shadow:0 18px 40px -24px rgba(48,60,30,.35)}
.ln-card h1{font-family:var(--f-display);font-size:21px;margin-bottom:2px}.ln-card .sub{color:var(--mu);font-size:14px;margin-bottom:18px}
.ln .fld label{color:var(--mu)}.ln .fld input{background:#FBFAF6;color:var(--ink2);border-color:var(--bd);min-height:44px}
.ln-go{width:100%;min-height:46px;border:0;border-radius:12px;background:var(--o);color:#fff;font-weight:700;cursor:pointer;font-size:15px}
.ln-go[disabled]{opacity:.6}.ln-link{border:0;background:none;color:var(--o);cursor:pointer;font-size:13px;padding:0;font-weight:500}
.ln-err{background:#F8E4DF;color:#9A2F22;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:14px}
.ln-ok{background:#E3E9D5;color:#2F3C1D;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:14px}
@media (max-width:1000px){.gm{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.band{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,1fr)}.top h1{font-size:23px}.kv{grid-template-columns:90px 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const PR={high:['عالية','c-bad'],med:['متوسطة','c-warn'],low:['منخفضة','']};
const MS={new:['مستجد','c-info'],active:['نشط','c-good'],paused:['موقوف','c-warn'],left:['منسحب','']};

const chip=(t,c='')=>`<span class="chip ${c}">${esc(t)}</span>`;
const ava=n=>`<span class="ava">${esc(String(n||'?').trim()[0]||'?')}</span>`;
const bar=(v,c='')=>`<div class="bar ${c}" role="progressbar" aria-valuenow="${v}" aria-valuemin="0" aria-valuemax="100"><i style="width:${v}%"></i></div>`;
let tt;function toast(m){const e=$('#toast');e.firstElementChild.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,3200)}
function openSheet(h){const o=$('#ov');o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${h}</div>`;o.hidden=false;document.body.style.overflow='hidden'}

let me=null,D=[],P=[],T=[],C=[],READ=new Set(),ALLREAD=[],N=[],AUD=[],INV=[];
let route='home',filt={dept:'all',mine:false},booted=false;
const dn=id=>(D.find(d=>d.id===id)||{name:'بدون إدارة'}).name;
const dfull=id=>{const d=D.find(x=>x.id===id);if(!d)return 'بدون إدارة';const pa=d.parent_id&&D.find(x=>x.id===d.parent_id);return pa?pa.name+' › '+d.name:d.name};
const committees=()=>D.filter(d=>!d.parent_id);
const kids=id=>D.filter(d=>d.parent_id===id);
const myDeptIds=()=>me&&me.dept_id?[me.dept_id,...kids(me.dept_id).map(d=>d.id)]:[];
function deptOpts(list,sel){const ids=new Set(list.map(d=>d.id));const out=[];
  list.filter(d=>!d.parent_id||!ids.has(d.parent_id)).forEach(c=>{out.push([c,0]);list.filter(x=>x.parent_id===c.id).forEach(k=>out.push([k,1]))});
  return out.map(([d,l])=>`<option value="${esc(d.id)}" ${d.id===sel?'selected':''}>${l?'↳ ':''}${esc(d.name)}</option>`).join('')}
const pn=id=>(P.find(p=>p.id===id)||{full_name:'—'}).full_name||'بدون اسم';
const isLeader=()=>me&&me.role==='leader',isMgr=()=>me&&me.role==='manager';
const isLate=t=>t.status!=='done'&&t.due<today();
const canManage=t=>isLeader()||(isMgr()&&myDeptIds().includes(t.dept_id));

/* ---------- التحميل ---------- */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){if(new URLSearchParams(location.search).get('join'))joinScreen();else loginScreen();return}
  if(NEEDS_PASSWORD&&!booted){passScreen();return}
  await enter(session);
}
async function enter(session){
  try{
    const prof=await q(sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle());
    if(!prof){authScreen(`<div class="ln-card"><h1>تعذر العثور على ملفك</h1><p class="sub">تواصل مع قيادة المبادرة.</p><button class="ln-go" data-act="logout">تسجيل الخروج</button></div>`);return}
    me=prof;
    if(me.status==='left'){authScreen(`<div class="ln-card"><h1>العضوية منتهية</h1><p class="sub">لم يعد لهذا الحساب صلاحية دخول.</p><button class="ln-go" data-act="logout">تسجيل الخروج</button></div>`);return}
    if(me.role==='member'&&!me.dept_id&&me.status==='new'){pendingScreen();return}
    await loadAll();booted=true;
    $('#auth').hidden=true;$('#auth').innerHTML='';document.body.classList.remove('locked');$('#app').hidden=false;
    route=(location.hash||'#home').slice(1);if(!PAGES[route]||!NAV.find(n=>n[0]===route))route='home';
    render();
  }catch(e){fail(e);loginScreen('تعذر تحميل البيانات. تأكد من الاتصال وأن قاعدة البيانات مهيّأة، ثم أعد المحاولة.')}
}
async function loadAll(){
  const [d,p,t,c,r,n]=await Promise.all([
    q(sb.from('departments').select('*').order('name')),
    q(sb.from('profiles').select('*').order('full_name')),
    q(sb.from('tasks').select('*').order('due')),

  <dt>الموعد النهائي</dt><dd style="${isLate(t)?'color:var(--bad);font-weight:700':''}">${fd(t.due)}${isLate(t)?' (متأخرة)':''}</dd><dt>الأولوية</dt><dd>${chip(PR[t.priority][0],PR[t.priority][1])}</dd>
  <dt>الاعتماد</dt><dd>${t.needs_formal_approval?(t.level1_approved?'اعتمده المسؤول، بانتظار الاعتماد الرسمي':'يتطلب اعتمادًا رسميًا من القيادة'):'اعتماد المسؤول المباشر'}</dd><dt>الإنجاز</dt><dd>${bar(t.progress)}</dd></dl>
  ${taskActs(t)}
  <div class="sec"><h4>السجل والتعليقات</h4><div class="tl">${ev.map(e=>`<div><span class="muted sm">${fd(e.created_at)} · ${esc(pn(e.actor_id))}</span><div>${e.kind==='comment'?'💬 ':''}${esc(e.body)}</div></div>`).join('')||'<span class="muted">لا يوجد سجل بعد.</span>'}</div>
  <form data-form="comment" data-id="${t.id}" class="row" style="margin-top:12px"><input class="sel" style="flex:1" id="cm" placeholder="اكتب تعليقًا" required><button class="btn pri">إرسال</button></form></div>`);
}
function newTaskSheet(){
  const dep=isLeader()?D:D.filter(d=>myDeptIds().includes(d.id));
  openSheet(shead('مهمة جديدة')+`<form data-form="newtask"><div class="fld"><label for="nt">اسم المهمة</label><input id="nt" required maxlength="140"></div>
  <div class="fld"><label for="nd">الوصف</label><textarea id="nd" rows="3"></textarea></div>

  <div class="fld"><label for="npr">الأولوية</label><select id="npr"><option value="high">عالية</option><option value="med" selected>متوسطة</option><option value="low">منخفضة</option></select></div>
  <label class="row" style="margin-bottom:14px"><input type="checkbox" id="nf"> يتطلب اعتمادًا رسميًا من القيادة</label><button class="btn pri" id="ntGo">إنشاء وتكليف</button></form>`);

function fillAssignees(){
  const d=$('#ndp').value,sel=$('#nw');
  const grp=[d,...kids(d).map(k=>k.id)];const ppl=P.filter(p=>grp.includes(p.dept_id)&&p.status!=='left'&&p.status!=='paused');
  sel.innerHTML=ppl.length?ppl.map(p=>`<option value="${p.id}">${esc(p.full_name||p.email)}</option>`).join(''):'<option value="">لا يوجد أعضاء في هذه الإدارة</option>';
}
function memberSheet(id){
  const p=P.find(x=>x.id===id);if(!p)return;const edit=isLeader(),self=p.id===me.id;
  openSheet(shead(esc(p.full_name||p.email||'عضو'))+`<div style="margin-bottom:12px">${chip(MS[p.status][0],MS[p.status][1])}</div>
  <dl class="kv"><dt>البريد</dt><dd dir="ltr" style="text-align:right">${esc(p.email||'—')}</dd><dt>الإدارة</dt><dd>${esc(dn(p.dept_id))}</dd><dt>المنصب</dt><dd>${esc(p.position)}</dd><dt>الدور</dt><dd>${RL[p.role]}</dd><dt>المسؤول المباشر</dt><dd>${p.manager_id?esc(pn(p.manager_id)):'—'}</dd><dt>الانضمام</dt><dd>${fd(p.joined_at)}</dd></dl>
  ${edit?`<form data-form="member" data-id="${p.id}"><div class="sec"><h4>الدور والمسؤوليات</h4></div>
  <div class="fld"><label for="mnm">الاسم</label><input id="mnm" value="${esc(p.full_name)}"></div>
  <div class="fld"><label for="mdp">الإدارة</label><select id="mdp"><option value="">بدون إدارة</option>${deptOpts(D,p.dept_id)}</select></div>
  <div class="fld"><label for="mpo">المنصب</label><input id="mpo" value="${esc(p.position)}"></div>
  <div class="fld"><label for="mrl">الدور في المنصة</label><select id="mrl" ${self?'disabled':''}>${Object.keys(RL).map(k=>`<option value="${k}" ${k===p.role?'selected':''}>${RL[k]}</option>`).join('')}</select>${self?'<span class="sm muted">لا يمكنك تغيير دورك بنفسك.</span>':''}</div>
  <div class="fld"><label for="mst">حالة العضوية</label><select id="mst" ${self?'disabled':''}>${Object.keys(MS).map(k=>`<option value="${k}" ${k===p.status?'selected':''}>${MS[k][0]}</option>`).join('')}</select></div>
  <div class="fld"><label for="mmg">المسؤول المباشر</label><select id="mmg"><option value="">لا يوجد</option>${P.filter(x=>x.id!==p.id&&x.role!=='member'||x.id===p.manager_id).map(x=>`<option value="${x.id}" ${x.id===p.manager_id?'selected':''}>${esc(x.full_name||x.email)}</option>`).join('')}</select></div>
  <button class="btn pri" id="mbGo">حفظ التغييرات</button></form>`:'<p class="muted sm">تعديل بيانات الأعضاء متاح للقيادة.</p>'}`);
}
function genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',b=crypto.getRandomValues(new Uint8Array(10));return [...b].map(x=>a[x%32]).join('')}
const fmtCode=c=>c.slice(0,5)+'-'+c.slice(5);
function inviteText(i){const url=location.origin+location.pathname;
  return `أهلًا ${i.full_name}، تمت إضافتك إلى منصة ثمرة.\nافتح الرابط: ${url}?join=${i.code}\nثم أدخل رمز التفعيل: ${fmtCode(i.code)}\nواكتب بريدك الخاص وكلمة المرور اللي تختارها.\nالرمز صالح حتى ${fd(i.expires_at)} ويُستخدم مرة واحدة.`}
function addMemberSheet(){
  openSheet(shead('إضافة عضو')+`<form data-form="addmember" autocomplete="off">
  <div class="fld"><label for="am1">الاسم الكامل</label><input id="am1" required maxlength="80"></div>
  <div class="fld"><label for="am3">الإدارة</label><select id="am3" required>${deptOpts(D)}</select></div>
  <div class="fld"><label for="am4">المنصب</label><input id="am4" value="عضو" maxlength="60"></div>
  <div class="fld"><label for="am5">الدور في المنصة</label><select id="am5"><option value="member">عضو</option><option value="manager">مدير إدارة</option></select></div>
  <div class="fld"><label for="am6">المسؤول المباشر</label><select id="am6"><option value="">لا يوجد</option>${P.filter(x=>x.role!=='member'&&x.status!=='left').map(x=>`<option value="${x.id}">${esc(x.full_name||x.email)}</option>`).join('')}</select></div>
  <div class="fld"><label for="am8">صلاحية الدعوة</label><select id="am8"><option value="3">3 أيام</option><option value="7" selected>7 أيام</option><option value="14">14 يومًا</option></select></div>
  <button class="btn pri" id="amGo">إنشاء الدعوة</button></form>`);
}
function inviteSheet(i){
  openSheet(shead('الدعوة جاهزة')+`<p style="margin-bottom:10px">أرسل هذه الرسالة للعضو. هو يدخل بريده وكلمة مروره بنفسه، وأنت لا تعرف كلمة مروره.</p>
  <div class="fld"><textarea id="credTxt" rows="7" readonly>${esc(inviteText(i))}</textarea></div>
  <div class="acts"><button class="btn pri" data-act="copycreds">نسخ الرسالة</button><button class="btn" data-act="close">تم</button></div>`);
}
function passSheet(){
  openSheet(shead('تغيير كلمة المرور')+`<form data-form="mypass"><div class="fld"><label for="mp1">كلمة المرور الجديدة (8 خانات على الأقل)</label><input id="mp1" type="password" autocomplete="new-password" dir="ltr" style="text-align:right"></div>
  <div class="fld"><label for="mp2">أعد كتابتها</label><input id="mp2" type="password" autocomplete="new-password" dir="ltr" style="text-align:right"></div><button class="btn pri" id="mpGo">حفظ</button></form>`);
}
function circSheet(){
  const dep=isLeader()?D:D.filter(d=>myDeptIds().includes(d.id));
  openSheet(shead('تعميم جديد')+`<form data-form="newcirc"><div class="fld"><label for="ct">العنوان</label><input id="ct" required maxlength="140"></div>
  <div class="fld"><label for="cb">النص</label><textarea id="cb" rows="6" required></textarea></div>
  <div class="fld"><label for="cd">موجّه إلى</label><select id="cd">${isLeader()?'<option value="">الجميع</option>':''}${deptOpts(dep)}</select></div>
  <label class="row" style="margin-bottom:14px"><input type="checkbox" id="ci"> تعميم مهم</label><button class="btn pri" id="ccGo">نشر التعميم</button>
  <p class="sm muted" style="margin-top:10px">الإرسال بالبريد الإلكتروني يُفعَّل لاحقًا بعد ربط الدومين.</p></form>`);
}

/* ---------- الإجراءات ---------- */
async function moveTask(id,to){
  const t=T.find(x=>x.id===id);if(!t)return;
  const patch={status:to};let ev='',who=[],msg='';
  if(to==='doing'){patch.progress=Math.max(t.progress,10);ev='بدأ التنفيذ'}
  if(to==='review'){patch.progress=100;ev='سُلّم العمل للمراجعة';who=P.filter(p=>p.role==='manager'&&p.dept_id===t.dept_id||p.role==='leader').map(p=>p.id);msg='«'+t.title+'» بانتظار مراجعتك'}
  if(to==='rework'){patch.progress=80;ev='أُعيدت للتعديل';who=[t.assignee_id];msg='«'+t.title+'» تحتاج تعديلًا'}
  if(to==='done'){patch.progress=100;ev='اعتُمدت واكتملت';who=[t.assignee_id];msg='اعتُمدت مهمتك «'+t.title+'»'}
  if(to==='l1'){delete patch.status;patch.level1_approved=true;ev='اعتمد المسؤول المباشر ورُفعت للاعتماد الرسمي';who=P.filter(p=>p.role==='leader').map(p=>p.id);msg='«'+t.title+'» بانتظار الاعتماد الرسمي'}
  try{
    await q(sb.from('tasks').update(patch).eq('id',id));
    await q(sb.from('task_events').insert({task_id:id,kind:'status',body:ev}));
    await notify(who,msg,'tasks');await log(ev+': '+t.title);
    toast('تم');const open=!$('#ov').hidden;await reload();if(open)taskSheet(id);
  }catch(e){fail(e);await reload()}
}
document.addEventListener('click',async e=>{
  if(e.target.id==='ov'){closeSheet();return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==='close'){closeSheet();return}
  if(a==='logout'){await sb.auth.signOut();me=null;booted=false;closeSheet();location.hash='';loginScreen();return}
  if(a==='reload'){location.reload();return}
  if(a==='forgot'){const em=$('#lgE').value.trim();if(!/^\S+@\S+\.\S+$/.test(em)){loginScreen('اكتب بريدك أولًا ثم اضغط «نسيت كلمة المرور».');return}
    const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});loginScreen(error?'تعذر الإرسال: '+error.message:'أرسلنا رابط الاستعادة إلى بريدك إن كان مسجلًا لدينا.',!error);return}
  if(a==='task'){if(e.target.closest('.acts'))return;taskSheet(+id);return}
  if(a.startsWith('t-')){e.stopPropagation();moveTask(+id,a.slice(2));return}
  if(a==='newtask'){newTaskSheet();return}
  if(a==='member'){memberSheet(id);return}
  if(a==='committee'){committeeSheet(el.dataset.id);return}
  if(a==='newcirc'){circSheet();return}
  if(a==='addmember'){addMemberSheet();return}
  if(a==='mypass'){passSheet();return}
  if(a==='invcopy'){const i=INV.find(x=>x.code===el.dataset.code);if(i)inviteSheet(i);return}
  if(a==='invdel'){try{await q(sb.from('invites').delete().eq('code',el.dataset.code));await log('ألغى دعوة');await reload();toast('أُلغيت الدعوة')}catch(err){fail(err)}return}
  if(a==='tojoin'){joinScreen();return}
  if(a==='tologin'){loginScreen();return}
  if(a==='copycreds'){const ta=$('#credTxt');ta.select();let ok=false;try{await navigator.clipboard.writeText(ta.value);ok=true}catch(err){try{ok=document.execCommand('copy')}catch(e2){}}toast(ok?'نُسخت الرسالة':'حدّد النص وانسخه يدويًا');return}
  if(a==='readc'){try{await q(sb.from('circular_reads').insert({circular_id:+id}));await reload()}catch(err){fail(err)}return}
  if(a==='nread'){try{await q(sb.from('notifications').update({read:true}).eq('id',+id))}catch(err){}
    const l=el.dataset.link;await reload();if(l&&NAV.find(n=>n[0]===l)){location.hash='#'+l}return}
  if(a==='readall'){try{await q(sb.from('notifications').update({read:true}).eq('user_id',me.id).eq('read',false));await reload()}catch(err){fail(err)}return}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='fDept'){filt.dept=el.value;render()}
  if(el.id==='fMine'){filt.mine=el.checked;render()}
  if(el.id==='ndp')fillAssignees();
});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,k=f.dataset.form,btn=f.querySelector('button:not([type=button])');
  const busy=v=>{if(btn)btn.disabled=v};
  try{
    if(k==='login'){const em=$('#lgE').value.trim(),pw=$('#lgP').value;
      if(!/^\S+@\S+\.\S+$/.test(em)){loginScreen('اكتب بريدًا إلكترونيًا صحيحًا.');return}
      if(!pw){loginScreen('اكتب كلمة المرور.');return}
      busy(true);const {data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
      if(error){loginScreen(error.message==='Invalid login credentials'?'البريد أو كلمة المرور غير صحيحة.':'تعذر الدخول: '+error.message);return}
      await enter(data.session);return}
    if(k==='newpass'){const a=$('#np1').value,b=$('#np2').value;
      if(a.length<8){passScreen('كلمة المرور لا تقل عن 8 خانات.');return}
      if(a!==b){passScreen('كلمتا المرور غير متطابقتين.');return}
      busy(true);const {error}=await sb.auth.updateUser({password:a});
      if(error){passScreen('تعذر الحفظ: '+error.message);return}
      history.replaceState(null,'',location.pathname);const {data:{session}}=await sb.auth.getSession();await enter(session);return}
    if(k==='join'){const code=$('#jc').value.trim(),em=$('#je').value.trim(),a=$('#jp1').value,b=$('#jp2').value;
      if(code.replace(/[^A-Za-z0-9]/g,'').length!==10){joinScreen('رمز التفعيل 10 خانات، تأكد منه.',code,em);return}
      if(!/^\S+@\S+\.\S+$/.test(em)){joinScreen('اكتب بريدًا إلكترونيًا صحيحًا.',code,em);return}
      if(a.length<8){joinScreen('كلمة المرور لا تقل عن 8 خانات.',code,em);return}
      if(a!==b){joinScreen('كلمتا المرور غير متطابقتين.',code,em);return}
      busy(true);const {data,error}=await sb.functions.invoke('redeem-invite',{body:{code,email:em,password:a}});
      if(error){let m=error.message;try{const j=await error.context.json();m=j.error||m}catch(e2){}joinScreen(m,code,em);return}
      if(data&&data.error){joinScreen(data.error,code,em);return}
      history.replaceState(null,'',location.pathname);
      const r2=await sb.auth.signInWithPassword({email:em,password:a});
      if(r2.error){loginScreen('تم تفعيل حسابك. سجّل دخولك الآن.',true);return}
      await enter(r2.data.session);return}
    busy(true);
    if(k==='comment'){const v=$('#cm').value.trim();if(!v){busy(false);return}
      await q(sb.from('task_events').insert({task_id:+f.dataset.id,kind:'comment',body:v}));taskSheet(+f.dataset.id);return}
    if(k==='newtask'){const title=$('#nt').value.trim(),w=$('#nw').value;
      if(!w){toast('اختر مكلّفًا من الإدارة');busy(false);return}
      const row=await q(sb.from('tasks').insert({title,description:$('#nd').value.trim(),dept_id:$('#ndp').value,assignee_id:w,due:$('#ndu').value,priority:$('#npr').value,needs_formal_approval:$('#nf').checked}).select().single());
      await q(sb.from('task_events').insert({task_id:row.id,kind:'created',body:'أُنشئت المهمة وكُلّف بها '+pn(w)}));
      await notify([w],'كُلّفت بمهمة جديدة: '+title,'tasks');await log('أنشأ مهمة: '+title);
      closeSheet();toast('أُنشئت المهمة وأُرسل إشعار للمكلّف');await reload();return}
    if(k==='member'){const id=f.dataset.id,p=P.find(x=>x.id===id),self=id===me.id;
      const patch={full_name:$('#mnm').value.trim(),dept_id:$('#mdp').value||null,position:$('#mpo').value.trim()||'عضو',manager_id:$('#mmg').value||null};
      if(!self){patch.role=$('#mrl').value;patch.status=$('#mst').value}
      else patch.role='leader';
      await q(sb.from('profiles').update(patch).eq('id',id));
      if(!self&&p.dept_id!==patch.dept_id)await notify([id],'نُقلت إلى '+dn(patch.dept_id),'home');
      if(!self&&p.status==='new'&&patch.status==='new'&&patch.dept_id)await q(sb.from('profiles').update({status:'active'}).eq('id',id));
      await log('عدّل بيانات '+(patch.full_name||p.email));closeSheet();toast('حُفظت التغييرات');await reload();return}
    if(k==='addmember'){const name=$('#am1').value.trim();if(!name){busy(false);return}
      const row={code:genCode(),full_name:name,dept_id:$('#am3').value,position:$('#am4').value.trim()||'عضو',role:$('#am5').value,manager_id:$('#am6').value||null,expires_at:new Date(Date.now()+(+$('#am8').value)*864e5).toISOString()};
      await q(sb.from('invites').insert(row));await log('أنشأ دعوة لـ '+name);await reload();inviteSheet(row);return}
    if(k==='mypass'){const a=$('#mp1').value,b=$('#mp2').value;
      if(a.length<8){toast('كلمة المرور لا تقل عن 8 خانات');busy(false);return}
      if(a!==b){toast('كلمتا المرور غير متطابقتين');busy(false);return}
      const {error}=await sb.auth.updateUser({password:a});if(error)throw error;closeSheet();toast('تم تغيير كلمة المرور');return}
    if(k==='newcirc'){const title=$('#ct').value.trim(),dept=$('#cd').value||null;
      await q(sb.from('circulars').insert({title,body:$('#cb').value.trim(),target_dept:dept,important:$('#ci').checked}));
      await notify(P.filter(p=>p.status!=='left'&&(!dept||p.dept_id===dept)).map(p=>p.id),'تعميم جديد: '+title,'circulars');
      await log('نشر تعميمًا: '+title);closeSheet();toast('نُشر التعميم');await reload();return}
  }catch(err){fail(err);busy(false)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_OUT'&&me){me=null;booted=false;loginScreen()}});
boot();
</script>
