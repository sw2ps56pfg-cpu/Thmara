<style>
/* Layout: right-hand navigation rail + working canvas; summary-first pages, kanban for tasks, drawers for detail. */
:root{
  --bg:#F6F4EE; --surface:#FFFFFF; --surface2:#ECE9DE; --ink:#26301D; --muted:#6B705D; --line:#DDD9CB;

}

  --good:#5FCB93; --warn:#E3A33F; --bad:#EE7B6C; --info:#6FA8E6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12170E; --surface:#1B2216; --surface2:#242C1D; --ink:#ECF0E3; --muted:#A0A98F; --line:#313B27;

*{box-sizing:border-box}
html,body{height:auto}

  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance;line-height:1.4}

a{color:inherit;text-decoration:none}

:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.brand small{color:var(--muted);font-size:11.5px}
.grp{display:flex;gap:2px;padding-inline-start:10px;margin-inline-start:4px;border-inline-start:1px solid var(--line);flex:none}

.c-info{background:color-mix(in srgb,var(--info) 15%,var(--surface));color:var(--info)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}

.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}

.band{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}

.band .s{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 14px;text-align:start;border-top:1px solid var(--line);vertical-align:middle}

.acts{display:flex;gap:6px;flex-wrap:wrap}

.flow>div.on{border-color:var(--brand)}

.tree,.tree ul{list-style:none;margin:0;padding:0}

.node{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);margin:6px 0;min-width:0}

.node.top-n{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

#ov{position:fixed;inset:0;background:rgba(8,16,12,.5);z-index:50;display:flex;justify-content:flex-start}

.sheet-h{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.sheet-h h2{flex:1;font-size:20px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld label{font-size:12.5px;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px;width:100%}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin-bottom:14px}
.kv dt{color:var(--muted);font-size:12.5px} .kv dd{margin:0;overflow-wrap:anywhere}
.sec{margin-top:18px}
.sec>h4{font-size:13px;color:var(--muted);margin-bottom:8px;letter-spacing:.03em}
.tl{border-inline-start:2px solid var(--line);padding-inline-start:12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:80;pointer-events:none}
.toast span{background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 16px;font-weight:500;max-width:90vw}

svg.ch{width:100%;height:auto;display:block}
.ch text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.ch .gl{stroke:var(--line);stroke-width:1}
.ch .ln{stroke:var(--brand);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}

.lgbox{background:#F8F5F0;border-radius:12px;padding:5px 10px;display:inline-flex;flex:none}.lgbox img{height:34px;width:auto;display:block}.lgbox.big{border-radius:20px;padding:16px 22px}.lgbox.big img{height:92px}

.ln{--o:#46552E;--o2:#7A9150;--ink2:#26301D;--mu:#6E7260;--bd:#DCD7C9;min-height:100dvh;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:32px max(16px,env(safe-area-inset-left,0px)) 32px max(16px,env(safe-area-inset-right,0px));

.ln .pw button{color:var(--mu)}
.ln-go{width:100%;min-height:46px;border:0;border-radius:12px;background:var(--o);color:#fff;font-weight:700;cursor:pointer;font-size:15px}

.ln-link{border:0;background:none;color:var(--o);cursor:pointer;font-size:13px;padding:0;font-weight:500}

.ln-demo{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;color:var(--mu);text-align:center}

.ln-demo .btn{background:rgba(255,255,255,.7);border-color:var(--bd);color:var(--ink2)}
.pw{position:relative}.pw button{position:absolute;inset-inline-start:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 8px;font-size:12.5px}

body.locked{padding-inline:0}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto}
@media (max-width:1100px){.g-main{grid-template-columns:minmax(0,1fr)}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}

</style>

function series(dept,n){
  const base=dept==='all'?D.reduce((a,d)=>a+d.base,0):DP(dept).base, seed=dept==='all'?3:dept.length;
  return Array.from({length:n},(_,i)=>{const mi=((9-(n-1-i))%12+12)%12;
    const v=Math.round(base*(0.72+0.28*(n>1?i/(n-1):1))+((i*7+seed)%5)-1);return{l:MONTHS[mi],v}});
}
function lineChart(data){
  const W=560,H=210,pl=14,pr=14,pt=22,pb=28,max=Math.ceil(Math.max(...data.map(d=>d.v))*1.15/5)*5||5;
  const step=data.length>1?(W-pl-pr)/(data.length-1):0;
  const X=i=>W-pr-i*step, Y=v=>pt+(H-pt-pb)*(1-v/max);
  const pts=data.map((d,i)=>[X(data.length-1-i),Y(d.v)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+` L${pts[pts.length-1][0]} ${H-pb} L${pts[0][0]} ${H-pb}Z`;
  const grid=[0,.5,1].map(f=>{const y=Y(max*f);return `<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${W-pr}" y="${y-4}" text-anchor="end">${Math.round(max*f)}</text>`}).join('');
  const lab=data.map((d,i)=>(data.length<=7||i%2===(data.length-1)%2)?`<text x="${pts[i][0]}" y="${H-8}" text-anchor="middle">${d.l}</text>`:'').join('');
  const last=pts[pts.length-1], lv=data[data.length-1].v;
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="رسم بياني لعدد المهام المنجزة شهريًا">${grid}<path class="ar" d="${area}"/><path class="ln" d="${path}"/>${pts.map((p,i)=>i<pts.length-1?`<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="3.5"/>`:'').join('')}<circle class="pe" cx="${last[0]}" cy="${last[1]}" r="5"/><text class="ev" x="${last[0]}" y="${last[1]-11}" text-anchor="middle">${lv}</text>${lab}</svg>`;
}
function barsChart(rows,max){
  const rh=30,W=560,H=rows.length*rh+4,lw=130;
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="مقارنة الإدارات">`+rows.map((r,i)=>{const y=i*rh+2,w=(W-lw-40)*r.v/max;
   return `<text x="${W}" y="${y+16}" text-anchor="end">${esc(r.l)}</text><rect class="bb" x="${W-lw-w}" y="${y+4}" width="${Math.max(w,2)}" height="14" rx="4"/><text class="ev" x="${W-lw-w-6}" y="${y+16}" text-anchor="end">${r.v}</text>`}).join('')+'</svg>';
}

const taskCard=t=>{const st=TS[t.status],lt=late(t),m=M(t.who);

 ${bar(t.progress,lt?'bad':'')}<div class="row sm"><span class="${lt?'':'muted'}" ${lt?'style="color:var(--bad);font-weight:600"':''}>${lt?'متأخرة · ':''}${fd(t.due)}</span>${t.formal?`<span class="chip c-acc">اعتماد رسمي</span>`:''}</div>${taskActs(t)}</div>`};
function taskActs(t){
  const b=(to,l,c='')=>`<button class="btn sm ${c}" data-act="mv" data-id="${t.id}" data-to="${to}">${l}</button>`;
  let a='';
  if(t.status==='new')a=b('doing','بدء التنفيذ');
  if(t.status==='doing')a=b('review','تسليم للمراجعة');
  if(t.status==='rework')a=b('review','إعادة التسليم');
  if(t.status==='review'&&role>=2){
    if(t.formal&&!t.l1)a=b('l1','اعتماد المسؤول','pri')+b('rework','إعادة للتعديل');
    else if(t.formal&&t.l1)a=(role===3?b('done','اعتماد رسمي','pri'):'<span class="chip c-acc">مرفوعة للقيادة</span>')+b('rework','إعادة للتعديل');
    else a=b('done','اعتماد','pri')+b('rework','إعادة للتعديل');
  }
  return a?`<div class="acts">${a}</div>`:'';
}

const tgMed=()=>{const a=TG.map(p=>p[1]).sort((x,y)=>x-y);return(a[9]+a[10])/2};
function postsChart(){
 const W=620,H=240,pl=10,pr=10,pt=24,pb=30,max=700,bw=(W-pl-pr)/TG.length,md=tgMed(),top=Math.max(...TG.map(p=>p[1]));
 const Y=v=>pt+(H-pt-pb)*(1-v/max);
 let o=`<svg class="ch" style="direction:ltr" viewBox="0 0 ${W} ${H}" role="img" aria-label="مشاهدات كل منشور في قناة تلجرام">`;
 [0,350,700].forEach(v=>o+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pl}" y="${Y(v)-4}">${v}</text>`);
 TG.forEach((p,i)=>{const x=pl+i*bw+bw*.16,w=bw*.68,y=Y(p[1]);
  o+=`<rect class="${p[1]===top?'bb':'bm'}" x="${x}" y="${y}" width="${w}" height="${Y(0)-y}" rx="3"/>`;
  if(p[1]>=180)o+=`<text class="ev" x="${x+w/2}" y="${y-5}" text-anchor="middle">${p[1]}</text>`;
  if(i%3===0||i===TG.length-1)o+=`<text x="${x+w/2}" y="${H-10}" text-anchor="middle">${p[0]}</text>`});
 return o+`<line class="md" x1="${pl}" x2="${W-pr}" y1="${Y(md)}" y2="${Y(md)}"/><text class="mt" x="${W-pr}" y="${Y(md)-5}" text-anchor="end">الوسيط ${md}</text></svg>`;
}

 <div class="sec"><h4>المخرجات: المتوقع والفعلي</h4><div class="grid g2"><div><span class="sm muted">المتوقع</span>${p.out.map(o=>`<div class="sm">• ${esc(o)}</div>`).join('')}</div><div><span class="sm muted">الفعلي</span>${p.act.map(o=>`<div class="sm">• ${esc(o)}</div>`).join('')}</div></div></div>
 <div class="sec"><h4>التحديات والمخاطر</h4>${p.risks.map(r=>`<div class="li sm"><span class="dot" style="background:var(--bad)"></span>${esc(r)}</div>`).join('')||'<span class="muted">لا توجد.</span>'}</div>
 <div class="sec"><h4>المهام المرتبطة</h4>${S.tasks.filter(t=>t.project===p.id).map(t=>`<div class="li click" data-act="task" data-id="${t.id}"><span class="t" style="flex:1">${esc(t.title)}</span>${chip(TS[t.status][0],TS[t.status][1])}</div>`).join('')||'<span class="muted">لا توجد مهام.</span>'}</div>
 ${p.lessons?`<div class="sec"><h4>تقرير ختامي ودروس مستفادة</h4><p>${esc(p.lessons)}</p></div>`:''}`);
}

/* ---------- actions ---------- */
function refresh(keep){render();}
function move(id,to){
 const t=S.tasks.find(x=>x.id===id),by=WHO[role],nm=n=>t.hist.push({t:'2026-10-23',x:n});
 if(to==='l1'){t.l1=true;nm('اعتمد المسؤول المباشر ('+by+') ورُفعت للاعتماد الرسمي');log('اعتمدت «'+t.title+'» ورفعتها للقيادة');notify('«'+t.title+'» بانتظار الاعتماد الرسمي');toast('رُفعت للاعتماد الرسمي');return}
 t.status=to;
 if(to==='doing'){nm('بدأ التنفيذ');if(!t.progress)t.progress=10}
 if(to==='review'){t.progress=100;nm('سُلّم العمل للمراجعة');notify('«'+t.title+'» بانتظار مراجعتك')}
 if(to==='rework'){t.progress=80;nm('أُعيدت للتعديل بواسطة '+by);notify('«'+t.title+'» تحتاج تعديلًا','tasks')}
 if(to==='done'){t.progress=100;nm('اعتُمدت وحُفظت في الأرشيف بواسطة '+by)}
 log((to==='done'?'اعتمدت':'غيّرت حالة')+' «'+t.title+'» إلى '+TS[to][0]);toast('الحالة الآن: '+TS[to][0]);
}
document.addEventListener('click',e=>{
 if(e.target.id==='ov'){closeSheet();return}
 const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT'||el.type==='checkbox')return;
 const a=el.dataset.act,id=+el.dataset.id;
 if(a==='logout'){authed=false;closeSheet();showLogin();return}
 if(a==='showpw'){const p=$('#lgP');p.type=p.type==='password'?'text':'password';el.textContent=p.type==='password'?'إظهار':'إخفاء';return}
 if(a==='forgot'){showLogin('استعادة كلمة المرور تعمل في النسخة الحقيقية عبر رابط يصل إلى بريدك.');return}
 if(a==='demo'){enter(+el.dataset.r);return}
 if(a==='menu'){document.body.classList.toggle('nav-open');return}
 if(a==='close'){closeSheet();return}
 if(a==='task'){if(e.target.closest('.acts button'))return;taskSheet(id);return}
 if(a==='mv'){e.stopPropagation();move(id,el.dataset.to);const open=!$('#ov').hidden;render();if(open)taskSheet(id);return}
 if(a==='newtask'){newTaskSheet();return}
 if(a==='member'){memberSheet(id);return}
 if(a==='dept'){e.stopPropagation();deptSheet(el.dataset.id);return}
 if(a==='proj'){projSheet(el.dataset.id);return}
 if(a==='accept'){const ap=S.apps.find(x=>x.id===id);S.apps=S.apps.filter(x=>x.id!==id);const nid=Math.max(...S.members.map(m=>m.id))+1;S.members.push({id:nid,name:ap.name,dept:ap.dept,role:'عضو',status:'new',mgr:DP(ap.dept).head,skills:ap.skills.split('،').map(s=>s.trim()),joined:'2026-10-23',done:0,score:0,hours:0,notes:[]});log('قبلت طلب انضمام '+ap.name);toast('قُبل '+ap.name+' عضوًا مستجدًا');render();return}
 if(a==='reject'){const ap=S.apps.find(x=>x.id===id);S.apps=S.apps.filter(x=>x.id!==id);log('رفضت طلب انضمام '+ap.name);toast('رُفض الطلب');render();return}
 if(a==='nread'){const n=S.notifs.find(x=>x.id==el.dataset.id);n.read=true;location.hash='#'+el.dataset.go;if(route==='notifs')render();return}
 if(a==='readall'){S.notifs.forEach(n=>n.read=true);render();return}
 if(a==='period'){filt.period=+el.dataset.v;render();return}
 if(a==='copycsv'){const v=el.dataset.csv;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('نُسخت البيانات، الصقها في Excel')).catch(()=>toast('تعذر النسخ في هذا العرض'));return}
 if(a==='att'){const m=S.meetings.find(x=>x.id===+el.dataset.m);m.att[el.dataset.id]=(m.att[el.dataset.id]+1)%3;render();return}
 if(a==='dec'){const m=S.meetings.find(x=>x.id===+el.dataset.m),d=m.dec.find(x=>x.id===id);d.st=d.st==='new'?'doing':'done';log('حدّثت تنفيذ قرار: '+d.x);render();return}
 if(a==='dec2task'){const m=S.meetings.find(x=>x.id===+el.dataset.m),d=m.dec.find(x=>x.id===id);d.task=1;const nid=Math.max(...S.tasks.map(t=>t.id))+1;S.tasks.push({id:nid,title:d.x,dept:M(d.who).dept==='lead'?'hr':M(d.who).dept,who:d.who,due:d.due,prio:'med',status:'new',progress:0,formal:false,l1:false,project:'',start:'2026-10-23',desc:'قرار من «'+m.t+'».',files:[],comments:[],hist:[{t:'2026-10-23',x:'أُنشئت من قرار اجتماع'}]});log('حوّلت قرارًا إلى مهمة');notify('كُلّفت بمهمة من قرار اجتماع: '+d.x);toast('أُنشئت مهمة مرتبطة بالقرار');render();return}
 if(a==='readc'){S.circ.find(c=>c.id===id).read=true;log('اطلعت على تعميم');render();return}
 if(a==='enroll'){const c=S.courses.find(x=>x.id===id);c.mine=true;c.p=5;c.en++;toast('سُجّلت في «'+c.n+'»');render();return}
 if(a==='learn'){const c=S.courses.find(x=>x.id===id);c.p=Math.min(100,c.p+15);if(c.p===100){log('أكملت دورة '+c.n);toast('مبروك! حصلت على شهادة إتمام')}render();return}
 if(a==='delst'){S.statuses[el.dataset.k].splice(+el.dataset.i,1);render();return}
});
document.addEventListener('change',e=>{
 const el=e.target,a=el.dataset&&el.dataset.act;
 if(el.id==='roleSel'){role=+el.value;go();return}
 if(el.id==='fDept'){filt.dept=el.value;render();return}
 if(el.id==='fMine'){filt.mine=el.checked;render();return}
 if(el.id==='pDept'){filt.pdept=el.value;render();return}
 if(el.id==='fCat'){filt.cat=el.value;render();return}
 if(a==='stage'){const p=S.partners.find(x=>x.id===+el.dataset.id);p.stage=el.value;log('نقلت «'+p.n+'» إلى مرحلة '+STG[el.value]);toast('نُقلت إلى: '+STG[el.value]);render();return}
 if(a==='perm'){const i=+el.dataset.i,j=+el.dataset.j;S.perms.m[i][j]=el.checked?1:0;log('عدّلت صلاحية «'+S.perms.rows[i]+'» لـ '+ROLES[3-j]);toast('حُفظت الصلاحية');return}
 if(a==='set'){S.settings[el.dataset.k]=el.checked;log('عدّلت إعدادًا في النظام');toast('حُفظ الإعداد');return}
});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target,k=f.dataset.form,id=+f.dataset.id;
 if(k==='login'){const em=$('#lgE').value.trim(),pw=$('#lgP').value;if(!/^\S+@\S+\.\S+$/.test(em)){showLogin('اكتب بريدًا إلكترونيًا صحيحًا.',em);return}if(pw.length<6){showLogin('كلمة المرور لا تقل عن 6 خانات.',em);return}enter(3);return}
 if(k==='newtask'){const nid=Math.max(...S.tasks.map(t=>t.id))+1,w=+$('#nw').value,title=$('#nt').value.trim();
  S.tasks.push({id:nid,title,desc:$('#nd').value.trim()||'لا يوجد وصف.',dept:$('#ndp').value,who:w,due:$('#ndu').value,prio:$('#npr').value,status:'new',progress:0,formal:$('#nf').checked,l1:false,project:'',start:'2026-10-23',files:[],comments:[],hist:[{t:'2026-10-23',x:'أُنشئت المهمة وكُلّف بها '+M(w).name}]});
  log('أنشأت مهمة «'+title+'»');notify('كُلّف '+M(w).name+' بمهمة: '+title);toast('أُنشئت المهمة وأُرسل إشعار للمكلّف');closeSheet();render();return}
 if(k==='comment'){const t=S.tasks.find(x=>x.id===id);t.comments.push({a:WHO[role],x:$('#cm').value.trim()});taskSheet(id);return}
 if(k==='member'){const m=S.members.find(x=>x.id===id),od=m.dept,os=m.status;m.dept=$('#mdp').value;m.role=$('#mrl').value;m.status=$('#mst').value;
  if(od!==m.dept){log('نقلت '+m.name+' إلى '+DP(m.dept).n);notify(m.name+' نُقل إلى '+DP(m.dept).n,'org')}else log('عدّلت بيانات '+m.name);
  toast('حُفظت التغييرات');closeSheet();render();return}
 if(k==='mnote'){const m=S.members.find(x=>x.id===id);m.notes.unshift('2026-10-23: '+$('#mn').value.trim());log('أضفت ملاحظة إدارية على '+m.name);memberSheet(id);return}
 if(k==='addst'){const v=f.querySelector('input').value.trim();if(v){S.statuses[f.dataset.k].push(v);log('أضفت حالة «'+v+'»');render()}return}
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.soc){SOC.manual[el.dataset.soc][el.dataset.f]=el.value.replace(/[^\d]/g,'');const b=document.getElementById('socCmp');if(b)b.innerHTML=socCmp()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();document.body.classList.remove('nav-open')}});
window.addEventListener('hashchange',go);
go();
</script>

</body></html>
